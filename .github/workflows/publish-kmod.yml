name: publish-kmod

# The ZFS modules for Void's kernel series and the Samba configuration, built
# when Void moves its kernel or zfs, or samba/version changes. They go to
# both releases: systems on the main channel read xbps-main, the others
# xbps-dev.

on:
  workflow_dispatch:
  push:
    branches: [dev]
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-kmod
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/void-linux/void-glibc:latest
    outputs:
      missing: ${{ steps.missing.outputs.missing }}
    defaults:
      run:
        shell: sh
    steps:
      - name: Install the tooling
        run: xbps-install -Syu xbps && xbps-install -y curl git

      - name: Check out freedomnas-void
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" src

      - name: Look for packages not published yet
        id: missing
        run: |
          missing="$( (GROUP=dev sh src/bin/missing.sh; GROUP=main sh src/bin/missing.sh) | tr ' ' '\n' | sort -u | tr '\n' ' ')"
          echo "missing=${missing% }" >> "$GITHUB_OUTPUT"

  build:
    concurrency:
      group: xbps-repodata
      cancel-in-progress: false
    needs: check
    if: needs.check.outputs.missing != ''
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/void-linux/void-glibc:latest
    defaults:
      run:
        shell: sh
    steps:
      - name: Install the tooling
        run: xbps-install -Syu xbps && xbps-install -y curl git github-cli

      - name: Check out freedomnas-void
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" src

      - name: Build the missing packages
        env:
          MISSING: ${{ needs.check.outputs.missing }}
        run: |
          for item in $MISSING; do
            case "$item" in
              samba-conf) sh src/bin/build-samba-conf.sh "$PWD/src/out" ;;
              *) sh src/bin/build-kmod.sh "$item" "$PWD/src/out" ;;
            esac
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VOID_SIGNING_KEY: ${{ secrets.VOID_SIGNING_KEY }}
        run: |
          [ -n "$VOID_SIGNING_KEY" ] || { echo "the VOID_SIGNING_KEY secret is not set" >&2; exit 1; }
          umask 077
          printf '%s\n' "$VOID_SIGNING_KEY" > /tmp/void-signing-key.pem
          for group in dev main; do
            GROUP=$group VOID_SIGNING_KEY_FILE=/tmp/void-signing-key.pem sh src/bin/publish-github.sh
          done
          rm -f /tmp/void-signing-key.pem
